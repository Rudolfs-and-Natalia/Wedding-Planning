<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RSVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3a3630;
    --ivory:#faf6ef;
    --sage:#7c8a6e;
    --sage-dark:#5f6b53;
    --rose:#c18b7a;
    --line:#e3ddcf;
    --error:#b5564a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ivory);
    color:var(--ink);
    font-family:'Jost', sans-serif;
    font-weight:300;
    line-height:1.6;
    padding:64px 20px 96px;
  }
  .wrap{
    max-width:620px;
    margin:0 auto;
  }
  .eyebrow{
    text-align:center;
    letter-spacing:.28em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--sage-dark);
    margin-bottom:14px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:500;
    font-size:52px;
    text-align:center;
    margin:0 0 8px;
    letter-spacing:.01em;
  }
  .sub{
    text-align:center;
    color:#7a7568;
    font-size:16px;
    margin-bottom:48px;
  }
  form{
    background:#fff;
    border:1px solid var(--line);
    border-radius:2px;
    padding:44px 40px;
  }
  fieldset{
    border:none;
    padding:0;
    margin:0 0 32px;
  }
  legend{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:22px;
    color:var(--sage-dark);
    margin-bottom:18px;
    padding:0;
  }
  .field{
    margin-bottom:20px;
  }
  label{
    display:block;
    font-size:13px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:#8a8471;
    margin-bottom:7px;
  }
  input[type="text"], input[type="email"], input[type="tel"], input[type="number"], textarea{
    width:100%;
    border:none;
    border-bottom:1px solid var(--line);
    background:transparent;
    padding:9px 2px;
    font-family:'Jost', sans-serif;
    font-size:16px;
    color:var(--ink);
    outline:none;
    transition:border-color .2s ease;
  }
  input:focus, textarea:focus{
    border-bottom-color:var(--sage);
  }
  textarea{ resize:vertical; min-height:64px; }

  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:520px){ .row2{ grid-template-columns:1fr; } }

  .choice-group{ display:flex; gap:28px; }
  .choice{
    display:flex; align-items:center; gap:8px;
    cursor:pointer;
    font-size:16px;
  }
  .choice input{ accent-color:var(--sage); width:16px; height:16px; }

  .checkbox-list{ display:flex; flex-direction:column; gap:14px; }
  .checkbox-item{
    display:flex; align-items:flex-start; gap:10px;
    cursor:pointer;
    font-size:15px;
  }
  .checkbox-item input{ accent-color:var(--sage); width:17px; height:17px; margin-top:2px; flex-shrink:0; }

  #guestDetails{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition:max-height .35s ease, opacity .3s ease;
  }
  #guestDetails.open{
    max-height:600px;
    opacity:1;
  }

  .submit-row{
    text-align:center;
    margin-top:8px;
  }
  button{
    font-family:'Jost', sans-serif;
    font-size:14px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#fff;
    background:var(--sage-dark);
    border:none;
    padding:15px 44px;
    cursor:pointer;
    transition:background .2s ease;
  }
  button:hover{ background:#4c5540; }
  button:disabled{ opacity:.55; cursor:not-allowed; }

  .status{
    text-align:center;
    margin-top:22px;
    font-size:15px;
    display:none;
  }
  .status.show{ display:block; }
  .status.success{ color:var(--sage-dark); }
  .status.error{ color:var(--error); }

  .hint{
    font-size:13px;
    color:#a39d8c;
    margin-top:4px;
  }

  .gift-note{
    text-align:center;
    margin-top:40px;
    font-size:14px;
    color:#a39d8c;
    font-style:italic;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Kindly Respond</div>
  <h1>RSVP</h1>
  <p class="sub">We can't wait to celebrate with you.</p>

  <form id="rsvpForm">
    <fieldset>
      <legend>Your details</legend>
      <div class="field">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" required />
      </div>
      <div class="row2">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="field">
          <label for="phone_number">Phone number</label>
          <input type="tel" id="phone_number" name="phone_number" />
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>Will you be joining us?</legend>
      <div class="choice-group">
        <label class="choice">
          <input type="radio" name="attending" value="yes" required />
          Joyfully accept
        </label>
        <label class="choice">
          <input type="radio" name="attending" value="no" required />
          Regretfully decline
        </label>
      </div>
    </fieldset>

    <div id="guestDetails">
      <fieldset>
        <legend>Your party</legend>
        <div class="field">
          <label for="number_of_guests">Number of guests (including you)</label>
          <input type="number" id="number_of_guests" name="number_of_guests" min="1" value="1" />
        </div>
        <div class="field">
          <label for="guest_names">Guest name(s)</label>
          <textarea id="guest_names" name="guest_names" placeholder="One name per line"></textarea>
        </div>
        <div class="field">
          <label for="dietary_restrictions">Dietary restrictions or allergies</label>
          <textarea id="dietary_restrictions" name="dietary_restrictions" placeholder="Optional"></textarea>
        </div>
      </fieldset>

      <fieldset>
        <legend>Travel & stay</legend>
        <div class="checkbox-list">
          <label class="checkbox-item">
            <input type="checkbox" name="travel_from_lisbon" />
            I would like transportation from Lisbon
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="travel_to_lisbon" />
            I would like transportation back to Lisbon
          </label>
          <label class="checkbox-item">
            <input type="checkbox" name="help_accommodation" />
            I would like help finding accommodation
          </label>
        </div>
      </fieldset>
    </div>

    <fieldset>
      <legend>A note for us</legend>
      <div class="field">
        <textarea id="message" name="message" placeholder="Optional"></textarea>
      </div>
    </fieldset>

    <div class="submit-row">
      <button type="submit" id="submitBtn">Send RSVP</button>
    </div>

    <div class="status" id="statusMsg"></div>
  </form>

  <!-- Placeholder for future gift-registry / honeymoon-fund page — not built yet -->
  <p class="gift-note">A gifts page (registry or honeymoon fund) is coming soon.</p>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // ---- fill these in from Supabase: Project Settings > API ----
  const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
  const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
  // ----------------------------------------------------------------

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('rsvpForm');
  const guestDetails = document.getElementById('guestDetails');
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');

  // Show/hide guest + travel fields based on attending choice
  form.querySelectorAll('input[name="attending"]').forEach(radio => {
    radio.addEventListener('change', (e) => {
      if (e.target.value === 'yes') {
        guestDetails.classList.add('open');
      } else {
        guestDetails.classList.remove('open');
      }
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusMsg.classList.remove('show', 'success', 'error');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending…';

    const data = new FormData(form);
    const attending = data.get('attending');

    const payload = {
      full_name: data.get('full_name'),
      email: data.get('email'),
      phone_number: data.get('phone_number') || null,
      attending,
      number_of_guests: attending === 'yes' ? parseInt(data.get('number_of_guests') || '1', 10) : 0,
      guest_names: attending === 'yes' ? (data.get('guest_names') || null) : null,
      dietary_restrictions: attending === 'yes' ? (data.get('dietary_restrictions') || null) : null,
      travel_from_lisbon: data.get('travel_from_lisbon') === 'on',
      travel_to_lisbon: data.get('travel_to_lisbon') === 'on',
      help_accommodation: data.get('help_accommodation') === 'on',
      message: data.get('message') || null,
    };

    const { error } = await supabase.from('rsvps').insert([payload]);

    submitBtn.disabled = false;
    submitBtn.textContent = 'Send RSVP';

    if (error) {
      statusMsg.textContent = "Something went wrong — please try again, or reach out to us directly.";
      statusMsg.classList.add('show', 'error');
      console.error(error);
    } else {
      statusMsg.textContent = "Thank you — your RSVP has been received!";
      statusMsg.classList.add('show', 'success');
      form.reset();
      guestDetails.classList.remove('open');
    }
  });
</script>
</body>
</html>
